# The downloadable Windows app: built in the cloud from the tagged commit, never on the owner's computer,
# so nothing personal can be in it (packaging/build.ps1 also checks). Push a tag like v1.0.0 to publish a
# release with MuseLifeGraph-windows.zip; run it by hand to get the zip as a workflow artifact only.
name: Windows app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: python -m pip install -r requirements.txt pyinstaller==6.16.0

      - name: FFmpeg (BtbN shared GPL build, with x264)
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\ffmpeg.zip"
          Invoke-WebRequest "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl-shared.zip" -OutFile $zip
          Expand-Archive $zip "$env:RUNNER_TEMP\ffmpeg"
          $bin = (Get-ChildItem "$env:RUNNER_TEMP\ffmpeg" -Recurse -Filter ffmpeg.exe | Select-Object -First 1).DirectoryName
          & "$bin\ffmpeg.exe" -hide_banner -encoders | Select-String "libx264"
          "FFMPEG_BIN=$bin" | Out-File -Append $env:GITHUB_ENV

      - name: Build, self-test and check
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File packaging\build.ps1 -FfmpegDir $env:FFMPEG_BIN -Python python

      - uses: actions/upload-artifact@v4
        with:
          name: MuseLifeGraph-windows
          path: dist/MuseLifeGraph-windows.zip*

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/MuseLifeGraph-windows.zip
            dist/MuseLifeGraph-windows.zip.sha256
          body: |
            **Muse Life Graph for Windows 10/11.** Unzip, open `MuseLifeGraph.exe`, and paste your own Meta Model API
            key and a free Neo4j AuraDB database on the first screen. Your keys and photos stay on your computer; you
            pay Meta directly for what Muse reads (about $0.006 a photo, shown before anything is spent).
            Not code-signed yet: Windows may say "Windows protected your PC" — choose More info, then Run anyway.
            Music and narration need an NVIDIA GPU and are not included (films get captions without them).
